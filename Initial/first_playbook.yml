
---

- name: Network Getting Started First Playbook
  connection: ansible.netcommon.network_cli
  gather_facts: false
  hosts: all
  tasks:

    - name: Cisco IOS, show running-configuration
      cisco.ios.ios_command:
        commands:
          - show running-config
      register: output

    - name: Display the config
      debug:
        var: output.stdout_lines
